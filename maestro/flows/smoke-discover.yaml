# Discover tab → decide search (search local stack) → song card → song page → back.
appId: com.nomadkaraoke.mobile
name: smoke-discover
---
- runScript:
    file: ../scripts/stack.js
    env:
      ACTION: config
      STACK: ${STACK}
- runFlow: ../common/launch.yaml
- assertVisible:
    id: "tab-discover"
- assertVisible:
    id: "tab-tonight"
- assertVisible:
    id: "tab-make"
- assertVisible:
    id: "tab-me"
- tapOn:
    id: "discover-search-input"
- inputText: "hello"
- extendedWaitUntil:
    visible:
      id: "song-card"
    timeout: 30000
- assertVisible:
    id: "song-card"
    text: ".*Adele.*"
- pressKey: Enter
- tapOn:
    id: "song-card"
- extendedWaitUntil:
    visible:
      id: "song-badge"
    timeout: 20000
- assertVisible:
    id: "song-make"
# iOS has no hardware back: the pushed song screen must offer a visible back button ("Navigate up" on Android).
- tapOn: "Back|Navigate up"
- assertVisible:
    id: "discover-search-input"
