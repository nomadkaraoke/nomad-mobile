plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.nomadkaraoke'
version = '1.0.0'

android {
  namespace "com.nomadkaraoke.shareintake"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

// kotlinx-coroutines comes from expo-modules-core (an `api` dependency there).
dependencies {
  testImplementation 'junit:junit:4.13.2'
}
