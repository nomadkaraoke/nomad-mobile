# Opens "Edit name", types NEW_NAME and saves (the guard, if the box asks, is left open). Env: NEW_NAME.
# Opens through tonight-open-sheet.yaml (waits, retries a sheet that came up without its accessibility tree on iOS 26).
appId: com.nomadkaraoke.mobile
---
- runFlow:
    file: tonight-open-sheet.yaml
    env:
      OPENER: "tonight-edit-name"
      EXPECT: "tonight-rename-input"
# No tap: the field has focus with the cursor after the name (a tap would put the cursor mid-name on Android, and
# eraseText deletes only what is before it, leaving the rest: names like "Tess64943").
# (Erased in a few passes, generously.)
- eraseText: 30
- eraseText: 30
- eraseText: 30
- inputText: ${NEW_NAME}
- tapOn:
    id: "tonight-rename-save"
- waitForAnimationToEnd:
    timeout: 3000
