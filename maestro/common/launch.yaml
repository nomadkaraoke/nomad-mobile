# Signed-out launch.
# iOS: clearKeychain drops the SecureStore session (MMKV keeps the install marker, so the app treats this as
# the same install, signed out). We avoid clearState there: on a dev-client build it wipes the remembered Metro
# server, and reconnecting triggers an iOS "Open in …?" SpringBoard prompt Maestro can't see.
# Android: clearKeychain is a no-op (the session would survive), so clearState, which also forgets the Metro
# server; the dev-client deep link then opens the app on Metro via the emulator's host alias 10.0.2.2 (no adb
# reverse rule to lose). (openLink is only a problem on iOS, see CLAUDE.md.) Typing the URL into the dev
# launcher instead hung Maestro's driver on the 10th flow of a suite (inputText/eraseText gRPC timeouts).
# The conditional steps only matter for a dev build that has no server yet; release/E2E builds skip them.
# METRO_PORT (maestro test -e, set by scripts/e2e-local.sh) is the Metro port, 8081 when unset. LAUNCH_TIMEOUT (ms,
# default 60000) bounds the launch waits; CI raises it, since a slow runner can still be bundling a route chunk.
appId: com.nomadkaraoke.mobile
---
- runFlow: close-browser-if-open.yaml
- stopApp
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          clearKeychain: true
      # Screenshot-based (no view-hierarchy query): right after a relaunch the first hierarchy query sometimes 500s
      # (kAXErrorInvalidUIElement), which failed the DEVELOPMENT SERVERS check below (me-2, 2026-10-25).
      - waitForAnimationToEnd:
          timeout: 3000
- runFlow:
    when:
      platform: Android
    commands:
      - clearState
      - openLink: "exp+nomad-karaoke://expo-development-client/?url=http%3A%2F%2F10.0.2.2%3A${typeof METRO_PORT !== 'undefined' && METRO_PORT ? METRO_PORT : '8081'}"
- runFlow:
    when:
      visible: "DEVELOPMENT SERVERS"
      platform: iOS
    commands:
      - tapOn:
          text: "http://.*:${typeof METRO_PORT !== 'undefined' && METRO_PORT ? METRO_PORT : '8081'}"
- extendedWaitUntil:
    visible: "Runtime version.*|Search songs or artists"
    timeout: "${typeof LAUNCH_TIMEOUT !== 'undefined' && LAUNCH_TIMEOUT ? LAUNCH_TIMEOUT : 60000}"
# A dev client that has never shown its menu (a fresh emulator or simulator: GitHub-hosted runners, or Android after
# clearState) first shows the menu's onboarding, whose only button is Continue; after that, the menu has Close.
- runFlow:
    when:
      visible: "This is the developer menu.*"
    commands:
      - tapOn: "Continue"
- runFlow:
    when:
      visible: "Runtime version.*"
    commands:
      - tapOn: "Close"
# Android: the Close tap above can land after the dev menu has gone, on whatever is behind it; twice that was
# the launcher's YouTube icon, leaving YouTube in front. Bring the app back if it isn't showing.
- runFlow:
    when:
      platform: Android
      notVisible:
        id: "discover-search-input"
    commands:
      - launchApp:
          stopApp: false
- extendedWaitUntil:
    visible:
      id: "discover-search-input"
    timeout: "${typeof LAUNCH_TIMEOUT !== 'undefined' && LAUNCH_TIMEOUT ? LAUNCH_TIMEOUT : 60000}"
