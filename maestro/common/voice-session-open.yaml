# Signed in on Discover (a seeded pop profile, so the picks and their Improve card show) → "Find your voice" →
# the intro's Start → the setup screen. Env: EMAIL (setup's output.email).
appId: com.nomadkaraoke.mobile
---
- runFlow:
    file: discover-seeded.yaml
    env:
      EMAIL: ${EMAIL}
      PROFILE: '{"genres":["pop"]}'
# The Improve card is last on the picks list; its session row needs decide's voice flags (session_enabled).
# scrollUntilVisible missed this row now and then on iOS (the row on screen, its 100% visibility check failing),
# so scroll to the list's end and wait for it.
- repeat:
    times: 8
    while:
      notVisible:
        id: "vs-entry-discover"
    commands:
      - scroll
- extendedWaitUntil:
    visible:
      id: "vs-entry-discover"
    timeout: 20000
- tapOn:
    id: "vs-entry-discover"
- extendedWaitUntil:
    visible:
      id: "vs-intro-start"
    timeout: 20000
- tapOn:
    id: "vs-intro-start"
- extendedWaitUntil:
    visible:
      id: "vs-setup-go"
    timeout: 20000
