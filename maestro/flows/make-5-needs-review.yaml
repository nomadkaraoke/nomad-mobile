# 5. Needs review (spec §8.5): auto_approve off → "Needs you" → Review lyrics opens the native review
# (Phase 2); back returns to the Make tab with the job still waiting.
appId: com.nomadkaraoke.mobile
name: make-5-needs-review
---
- runScript:
    file: ../scripts/stack.js
    env:
      ACTION: setup
      STACK: ${STACK}
      NAME: review
      CREDITS: "2"
      USER_CONFIG: '{"auto_approve":false}'
- runFlow: ../common/launch.yaml
- runFlow:
    file: ../common/make-any.yaml
    env:
      ARTIST: "Fake Artist"
      TITLE: "Review Song"
- runFlow:
    file: ../common/google-signin.yaml
    env:
      EMAIL: ${output.email}
- extendedWaitUntil:
    visible:
      id: "make-pick"
    timeout: 30000
- runFlow: ../common/make-submit.yaml
- extendedWaitUntil:
    visible:
      id: "job-review-.*"
    timeout: 90000
- assertVisible:
    id: "job-needs-you-.*"
- takeScreenshot: ${SHOTS}/make-tab-needs-review
- tapOn:
    id: "job-review-.*"
- extendedWaitUntil:
    visible:
      id: "review-step-lyrics"
    timeout: 60000
- assertVisible:
    id: "review-line-0"
- takeScreenshot: ${SHOTS}/make-native-review
- tapOn: "Back|Navigate up"
- extendedWaitUntil:
    visible:
      id: "job-review-.*"
    timeout: 20000
