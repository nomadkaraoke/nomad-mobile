# 5. Needs review (spec §8.5): auto_approve off → "Needs you" → Review lyrics opens the web review.
appId: com.nomadkaraoke.mobile
name: make-5-needs-review
---
- runScript:
    file: ../scripts/stack.js
    env:
      ACTION: setup
      STACK: ${STACK}
      NAME: review
      CREDITS: "2"
      USER_CONFIG: '{"auto_approve":false}'
- runFlow: ../common/launch.yaml
- runFlow:
    file: ../common/make-any.yaml
    env:
      ARTIST: "Fake Artist"
      TITLE: "Review Song"
- runFlow:
    file: ../common/google-signin.yaml
    env:
      EMAIL: ${output.email}
- extendedWaitUntil:
    visible:
      id: "make-pick"
    timeout: 30000
- tapOn:
    id: "make-submit"
- extendedWaitUntil:
    visible:
      id: "job-review-.*"
    timeout: 90000
- assertVisible:
    id: "job-needs-you-.*"
- takeScreenshot: docs/screenshots/phase1/${PLATFORM}/make-tab-needs-review
- tapOn:
    id: "job-review-.*"
# The in-app browser opens gen web (the local stack's Next app) on the single-use handoff link
# (/auth/verify?…&handoff=1), which signs in without a tap and then goes on to the review.
- extendedWaitUntil:
    visible: ".*127\\.0\\.0\\.1.*"
    timeout: 30000
# Signed in by the handoff: gen web shows "Successfully signed in!" for a moment, then the review page
# loads (first Next dev compile can be slow; a fast redirect can skip past the interstitial). The review
# page is only reachable signed in, and it must load. "Failed to load lyrics" here is gen's correction-data
# race: GET /api/review/{id}/correction-data checks awaiting_review then transitions to in_review, and two
# concurrent loads make the second one 500 (in_review -> in_review). Seen on iOS every run, not on Android.
# Wait for the page to settle on the review UI or one of the failures, whichever comes first.
- extendedWaitUntil:
    visible: ".*Lyrics Transcription Review.*|Failed to load lyrics|.*page could not be found.*"
    timeout: 90000
- assertNotVisible: "Failed to load lyrics"
- assertNotVisible: ".*page could not be found.*"
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: docs/screenshots/phase1/${PLATFORM}/review-bridge-browser
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Done"
- runFlow:
    when:
      platform: Android
    commands:
      - back
- extendedWaitUntil:
    visible:
      id: "job-review-.*"
    timeout: 20000
