# Review 13: a stale "review your lyrics" push tapped after the song finished. Gen answers start-review with 409
# (gen >= v0.290.1), and the app opens the song's job page instead of a connection error. The deep link is the
# same route a push tap opens (/review/<id>).
appId: com.nomadkaraoke.mobile
name: review-13-finished-song
---
- runScript:
    file: ../scripts/stack.js
    env:
      ACTION: setup
      STACK: ${STACK}
      NAME: review13
- runScript:
    file: ../scripts/stack.js
    env:
      ACTION: scenario
      STACK: ${STACK}
      SCENARIO: job_complete
- runFlow: ../common/launch.yaml
- runFlow:
    file: ../common/me-signin.yaml
    env:
      EMAIL: ${output.email}
- openLink: "nomadkaraoke://review/${output.jobId}"
# A simulator that hasn't opened the scheme before asks "Open in ...?" (see tonight-1).
- extendedWaitUntil:
    visible: "Open in .*"
    timeout: 5000
    optional: true
- runFlow:
    when:
      visible: "Open in .*"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible:
      id: "ready-screen"
    timeout: 30000
- assertNotVisible:
    id: "review-load-error"
- takeScreenshot: ${REVIEW_SHOTS}/review-13-finished-song
