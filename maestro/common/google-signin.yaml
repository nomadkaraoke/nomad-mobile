# The sign-in sheet's fake Google path (EXPO_PUBLIC_FAKE_SOCIAL_SIGNIN=1 sends fake:<email>). Env: EMAIL.
#
# Android: typing raises the keyboard, and on a loaded CI emulator (software GPU) its inset animation ran for 10 s
# ("force finish cuj, time out: IME_INSETS_SHOW_ANIMATION"). A tap during it landed where the button was before the
# window resized: no press, no spinner, no error, and the flow stalled on the sheet (nightlies 2026-10-29/30). So wait
# for the screen to settle, and tap again if the button is still idle (it shows a spinner instead of its label while
# signing in, and is disabled then, so a second tap can't start a second sign-in). The release build has no email
# field on this sheet (fake mode only), so real users never type here first.
appId: com.nomadkaraoke.mobile
---
- extendedWaitUntil:
    visible:
      id: "signin-sheet"
    timeout: 10000
- tapOn:
    id: "signin-fake-email"
- inputText: ${EMAIL}
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: "signin-google"
- extendedWaitUntil:
    notVisible:
      id: "signin-sheet"
    timeout: 5000
    optional: true
- runFlow:
    when:
      visible: "Continue with Google"
    commands:
      - waitForAnimationToEnd:
          timeout: 5000
      - tapOn:
          id: "signin-google"
