# Screen tours: a signed-out launch right after e2e-local.sh set the app language (no browser check: Maestro's view
# hierarchy 500s on an app it just relaunched). Then signs in from Discover (fake Google, EMAIL). testIDs only.
appId: com.nomadkaraoke.mobile
---
- runFlow: tour-launch-signed-out.yaml
- tapOn:
    id: "discover-signin"
- runFlow:
    file: google-signin.yaml
    env:
      EMAIL: ${EMAIL}
- extendedWaitUntil:
    visible:
      id: "discover-search-input"
    timeout: 30000
