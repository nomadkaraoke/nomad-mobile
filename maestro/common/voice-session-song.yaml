# One sung song: "I know this" → the fake player (40 s, see e2e-local.sh; the session starts it once the recorder runs) → the quiz →
# Q1 loved, Q2 comfortable unless the recording pre-filled it, Q3 easy → Next → the next pick or the result.
# Env: EXPECT_PREFILL ("true": the recording's highest/lowest line shows), SHOT (optional: quiz screenshot path),
# FALSETTO ("yes": wait for the live "High note: falsetto?" chip on the fake mic's held A4, about 8 s in, and answer
# Yes within its 5 s; needs a chest reference, e.g. a seeded profile; FALSETTO_SHOT optional screenshot of it),
# CATCHUP ("assert": the quiz must show the falsetto catch-up). Whenever the catch-up shows, its first row is answered
# "Not sure" (the note stays in the percentiles but out of the held bounds), so every flow's pitch is the same whether
# or not a chip came up.
appId: com.nomadkaraoke.mobile
---
- tapOn:
    id: "vs-pick-know"
- extendedWaitUntil:
    visible:
      id: "vs-play"
    timeout: 20000
- runFlow:
    when:
      true: ${FALSETTO == 'yes'}
    commands:
      - extendedWaitUntil:
          visible:
            id: "vs-falsetto-chip"
          timeout: 30000
      - runFlow:
          when:
            true: ${FALSETTO_SHOT != null && FALSETTO_SHOT != ''}
          commands:
            - takeScreenshot: ${FALSETTO_SHOT}
      - tapOn:
          id: "vs-falsetto-yes"
      - assertNotVisible:
          id: "vs-falsetto-chip"
- extendedWaitUntil:
    visible:
      id: "vs-quiz-next"
    timeout: 70000
- runFlow:
    when:
      true: ${EXPECT_PREFILL == 'true'}
    commands:
      - assertVisible:
          id: "vs-prefill"
- runFlow:
    when:
      true: ${CATCHUP == 'assert'}
    commands:
      - assertVisible:
          id: "vs-falsetto-catchup"
- runFlow:
    when:
      visible:
        id: "vs-falsetto-q-0-unsure"
    commands:
      - tapOn:
          id: "vs-falsetto-q-0-unsure"
- runFlow:
    when:
      true: ${SHOT != null && SHOT != ''}
    commands:
      - takeScreenshot: ${SHOT}
- tapOn:
    id: "vs-q-feel-loved"
- runFlow:
    when:
      notVisible:
        id: "vs-q-position-.*"
        selected: true
    commands:
      - tapOn:
          id: "vs-q-position-comfortable"
- scrollUntilVisible:
    element:
      id: "vs-q-difficulty-easy"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "vs-q-difficulty-easy"
- tapOn:
    id: "vs-quiz-next"
- extendedWaitUntil:
    visible:
      id: "vs-pick-know|vs-result-type"
    timeout: 30000
