# Search parity 2 (spec §4.1 outcome 2): decide identifies the song but there's no karaoke version of it → the
# "No karaoke version yet" card → Make it → sign in → the make screen with decide's canonical artist and title
# → a job made with exactly those (checked on the stack's job record).
appId: com.nomadkaraoke.mobile
name: search-2-missing-make
---
- runScript:
    file: ../scripts/stack.js
    env:
      ACTION: setup
      STACK: ${STACK}
      NAME: missing
      CREDITS: "2"
- runFlow: ../common/launch.yaml
- tapOn:
    id: "discover-search-input"
- inputText: "machu picchu strokes"
- extendedWaitUntil:
    visible:
      id: "missing-card"
    timeout: 30000
- assertVisible: ".*Machu Picchu.*"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${SHOTS}/search-missing-card
- tapOn:
    id: "missing-card-make"
- runFlow:
    file: ../common/google-signin.yaml
    env:
      EMAIL: ${output.email}
- extendedWaitUntil:
    visible:
      id: "make-pick"
    timeout: 30000
- assertVisible:
    id: "make-song-title"
    text: "Machu Picchu"
- assertVisible:
    id: "make-song-artist"
    text: "The Strokes"
- takeScreenshot: ${SHOTS}/search-missing-make
- runFlow: ../common/make-submit.yaml
- extendedWaitUntil:
    visible:
      id: "job-card-.*"
    timeout: 20000
- runScript:
    file: ../scripts/stack.js
    env:
      ACTION: job
      STACK: ${STACK}
      TOKEN: ${output.token}
      EXPECT_ARTIST: "The Strokes"
      EXPECT_TITLE: "Machu Picchu"
