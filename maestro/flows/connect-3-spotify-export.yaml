# Connect 3 (Phase 3b spec §5.4): Connect → Spotify history → pick the synthetic Extended streaming history
# (scripts/make-import-fixtures.ts; iOS Files "On My iPhone", Android Downloads) → read on the phone → preview →
# Import → the queue sends it → what it added → Discover's "Songs you know" has Starlight (played 12 times).
appId: com.nomadkaraoke.mobile
name: connect-3-spotify-export
tags:
  - connect
---
- runScript:
    file: ../scripts/stack.js
    env:
      ACTION: setup
      STACK: ${STACK}
      NAME: connect3
- runFlow:
    file: ../common/connect-open.yaml
    env:
      EMAIL: ${output.email}
- tapOn:
    id: "connect-card-spotify-export"
- extendedWaitUntil:
    visible:
      id: "connect-spotify-export"
    timeout: 10000
- takeScreenshot: ${SHOTS3B}/connect-3-guide
- scrollUntilVisible:
    element:
      id: "connect-spotify-pick"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "connect-spotify-pick"
- runFlow: ../common/connect-pick-export.yaml
- extendedWaitUntil:
    visible:
      id: "connect-import-preview"
    timeout: 30000
- takeScreenshot: ${SHOTS3B}/connect-3-preview
- tapOn:
    id: "connect-import-start"
- extendedWaitUntil:
    visible:
      id: "connect-import-result"
    timeout: 60000
- takeScreenshot: ${SHOTS3B}/connect-3-result
- runScript:
    file: ../scripts/stack.js
    env:
      ACTION: source-counts
      DECIDE_STACK: ${DECIDE_STACK}
      SOURCE: spotify_export
      MIN_SONGS: "1"
# Import file → Spotify guide → Connect → Discover.
- runFlow: ../common/connect-back-to-tabs.yaml
- tapOn:
    id: "tab-discover"
# The picks list is still scrolled down to the Improve card, and "Songs you know" is the first shelf.
- scrollUntilVisible:
    element:
      id: "rec-row-songs_you_know-.*"
      text: ".*Starlight.*"
    direction: UP
    centerElement: true
    timeout: 30000
- takeScreenshot: ${SHOTS3B}/connect-3-known
