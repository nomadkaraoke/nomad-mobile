# Search parity 3 (spec §4.1 outcome 3): an ambiguous query → "Which song do you mean?" chips → picking one shows
# that song's card.
appId: com.nomadkaraoke.mobile
name: search-3-which-one
---
- runScript:
    file: ../scripts/stack.js
    env:
      ACTION: config
      STACK: ${STACK}
- runFlow: ../common/launch.yaml
- tapOn:
    id: "discover-search-input"
- inputText: "baby"
- extendedWaitUntil:
    visible:
      id: "which-one-chip-0"
    timeout: 30000
- assertNotVisible:
    id: "song-card"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${SHOTS}/search-which-one
- tapOn:
    id: "which-one-chip-0"
- extendedWaitUntil:
    visible:
      id: "song-card"
    timeout: 10000
- assertNotVisible:
    id: "which-one"
- takeScreenshot: ${SHOTS}/search-which-one-picked
