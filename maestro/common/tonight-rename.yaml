# Opens "Edit name", types NEW_NAME and saves (the guard, if the box asks, is left open). Env: NEW_NAME.
# Opens through tonight-open-sheet.yaml (waits, retries a sheet that came up without its accessibility tree on iOS 26).
appId: com.nomadkaraoke.mobile
---
- runFlow:
    file: tonight-open-sheet.yaml
    env:
      OPENER: "tonight-edit-name"
      EXPECT: "tonight-rename-input"
- tapOn:
    id: "tonight-rename-input"
- eraseText: 40
- inputText: ${NEW_NAME}
- tapOn:
    id: "tonight-rename-save"
- waitForAnimationToEnd:
    timeout: 3000
