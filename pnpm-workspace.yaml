packages:
  - apps/*
  - packages/*
allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  '@shopify/react-native-skia': true
  better-sqlite3: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.30 || 57.0.31'
  - '@expo/metro-runtime@57.0.17'
  - '@expo/prebuild-config@57.0.19'
  - '@expo/ui@57.0.24 || 57.0.25'
  - expo-asset@57.0.20
  - expo-constants@57.0.22
  - expo-linking@57.0.13
  - expo-modules-autolinking@57.0.16
  - expo-modules-core@57.0.23
  - expo-router@57.0.27 || 57.0.28
  - expo@57.0.29 || 57.0.30
  - '@expo/router-server@57.0.13'
  - babel-preset-expo@57.0.16
nodeLinker: hoisted
