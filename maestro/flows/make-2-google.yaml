# 2. Google sign-in (spec §8.2) through the fake social switch, landing in the make flow.
appId: com.nomadkaraoke.mobile
name: make-2-google
---
- runScript:
    file: ../scripts/stack.js
    env:
      ACTION: setup
      STACK: ${STACK}
      NAME: google
      CREDITS: "2"
- runFlow: ../common/launch.yaml
- runFlow:
    file: ../common/make-any.yaml
    env:
      ARTIST: "Fake Artist"
      TITLE: "Google Song"
- runFlow:
    file: ../common/google-signin.yaml
    env:
      EMAIL: ${output.email}
# Straight on into the make flow: gen's pick for the typed song.
- extendedWaitUntil:
    visible:
      id: "make-pick"
    timeout: 30000
- assertVisible: "Google Song"
- takeScreenshot: ${SHOTS}/make-after-google-signin
- runFlow: ../common/make-submit.yaml
- extendedWaitUntil:
    visible:
      id: "job-card-.*"
    timeout: 20000
