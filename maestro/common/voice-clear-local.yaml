# Signed in on Discover: removes a voice profile this phone still holds from an earlier flow's user (iOS keeps the
# app's data across launch.yaml, and a keychain-cleared launch is no sign-out, so the phone's copy survives), then
# goes back to Discover. Me → Your music profile → Your voice → Remove my voice → confirm.
appId: com.nomadkaraoke.mobile
---
- tapOn:
    id: "tab-me"
- tapOn:
    id: "me-music-profile"
- scrollUntilVisible:
    element:
      id: "voice-section"
    direction: DOWN
    timeout: 15000
- runFlow:
    when:
      visible:
        id: "voice-remove"
    commands:
      - tapOn:
          id: "voice-remove"
      # The confirm alert's destructive button (Android may show it upper-case). Anchored below the alert's title:
      # the profile's artist rows have "Remove" buttons too (scrolled out of view under the header).
      - tapOn:
          text: "Remove|REMOVE"
          below: "Remove your voice\\?"
- scrollUntilVisible:
    element:
      id: "voice-test"
    direction: DOWN
    timeout: 15000
- tapOn: "Back|Navigate up"
- tapOn:
    id: "tab-discover"
