# Restart the app keeping its state (session, drafts, app language), then open a job's review from the Make tab.
# Works in any app language (testIDs only; the dev launcher and dev menu are native English). Env: JOB_ID.
# iOS: launchApp keeps the keychain; the dev client reopens the last bundle on its own.
# Android: launchApp would land in the dev launcher, so open Metro again with the dev-client link (no clearState).
appId: com.nomadkaraoke.mobile
---
- stopApp
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp
- runFlow:
    when:
      platform: Android
    commands:
      - openLink: "exp+nomad-karaoke://expo-development-client/?url=http%3A%2F%2F10.0.2.2%3A8081"
- runFlow:
    when:
      visible: "DEVELOPMENT SERVERS"
      platform: iOS
    commands:
      - tapOn:
          text: "http://.*:8081"
- runFlow: dismiss-dev-menu.yaml
- tapOn:
    id: "tab-make"
- runFlow:
    file: tap-job-review.yaml
    env:
      JOB_ID: ${JOB_ID}
