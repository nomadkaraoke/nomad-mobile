# Discover's picks → the Improve card's "Find your voice" row, fully on screen (it is last on the list).
# scrollUntilVisible missed this row now and then on iOS (the row on screen, its 100% visibility check failing),
# so scroll until it shows, then once more: a row that only just showed at the bottom edge has its centre under
# the tab bar, and the tap opened Make instead (full iOS suite).
appId: com.nomadkaraoke.mobile
---
- repeat:
    times: 8
    while:
      notVisible:
        id: "vs-entry-discover"
    commands:
      - scroll
- scroll
- extendedWaitUntil:
    visible:
      id: "vs-entry-discover"
    timeout: 20000
