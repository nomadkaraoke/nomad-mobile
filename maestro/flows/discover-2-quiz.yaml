# Discover core 2 (Phase 3a spec §8.2, §9.2): the 4-step taste quiz from the Discover card → genres → decades and
# energy → artists (a suggestion tapped twice = love) → a song you love → Finish → personal picks in sections, with
# the loved artist's songs among them. decide's local stack has no BigQuery: its smart suggestions
# come from catalog.db there (popular fixture artists in the chosen genre/decade).
appId: com.nomadkaraoke.mobile
name: discover-2-quiz
---
- runScript:
    file: ../scripts/stack.js
    env:
      ACTION: setup
      STACK: ${STACK}
      NAME: discover2
- runScript:
    file: ../scripts/stack.js
    env:
      ACTION: decide-reset
      DECIDE_STACK: ${DECIDE_STACK}
- runFlow: ../common/launch.yaml
- runFlow:
    file: ../common/discover-signin.yaml
    env:
      EMAIL: ${output.email}
- extendedWaitUntil:
    visible:
      id: "discover-quiz-card"
    timeout: 30000
- tapOn:
    id: "discover-quiz-start"
# Step 1: genres (at least one before Next).
- extendedWaitUntil:
    visible:
      id: "quiz-genre-rock"
    timeout: 20000
- tapOn:
    id: "quiz-genre-rock"
- takeScreenshot: ${DISCOVER_SHOTS}/discover-2-quiz-1-genres
- tapOn:
    id: "quiz-next"
# Step 2: decades and energy.
- extendedWaitUntil:
    visible:
      id: "quiz-decade-2000s"
    timeout: 10000
- tapOn:
    id: "quiz-decade-2000s"
- tapOn:
    id: "quiz-energy-high"
- takeScreenshot: ${DISCOVER_SHOTS}/discover-2-quiz-2-decades-energy
- tapOn:
    id: "quiz-next"
# Step 3: artists. Suggestions load after leaving step 2.
- extendedWaitUntil:
    visible:
      id: "quiz-artist-search"
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: "quiz-artist-suggestion-0"
    timeout: 10000
- copyTextFrom:
    id: "quiz-artist-suggestion-0"
- runScript:
    file: ../scripts/remember-text.js
    env:
      NAME: lovedArtist
      FIRST_PART: "1"
# Tap once = like, twice = love (new suggestions are appended, so the tile stays at index 0).
- tapOn:
    id: "quiz-artist-suggestion-0"
- extendedWaitUntil:
    visible:
      id: "quiz-artist-suggestion-0"
      text: ".*${output.lovedArtist}.*✓ Like.*"
    timeout: 5000
- tapOn:
    id: "quiz-artist-suggestion-0"
- extendedWaitUntil:
    visible:
      id: "quiz-artist-suggestion-0"
      text: ".*${output.lovedArtist}.*♥ Love.*"
    timeout: 5000
- takeScreenshot: ${DISCOVER_SHOTS}/discover-2-quiz-3-artists
- tapOn:
    id: "quiz-next"
# Step 4: a song you love, from song search (the keyboard is up: Finish must stay above it).
- extendedWaitUntil:
    visible:
      id: "quiz-song-search"
    timeout: 10000
- tapOn:
    id: "quiz-song-search"
- inputText: "starlite muse"
- extendedWaitUntil:
    visible:
      id: "quiz-song-0"
      text: ".*Starlight.*"
    timeout: 20000
- tapOn:
    id: "quiz-song-0"
- assertVisible:
    id: "quiz-picked-song-0"
- assertVisible:
    id: "quiz-finish"
- takeScreenshot: ${DISCOVER_SHOTS}/discover-2-quiz-4-songs-keyboard
- tapOn:
    id: "quiz-finish"
# Back on Discover with picks in sections.
- extendedWaitUntil:
    visible:
      id: "discover-picks"
    timeout: 30000
# The loved artist's songs are in the picks as songs you know or under "Artists you love": decide seeds a
# quiz artist's top 5 songs as known (so an artist with few fixture songs lands only in "Songs you know") and
# the rest show as "You like <artist>". Neither shelf can hold that artist without the artist tap (the loved
# song on step 4 is Muse; genre/decade matches go to the discovery shelves), so this is the love's outcome.
- extendedWaitUntil:
    visible:
      id: "rec-section-(songs_you_know|artists_you_love)"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "rec-row-(songs_you_know|artists_you_love)-.*"
      text: ".*${output.lovedArtist}.*"
    direction: DOWN
    timeout: 20000
- assertNotVisible:
    id: "discover-quiz-card"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${DISCOVER_SHOTS}/discover-2-picks
