# Relaunch the app keeping its data (still signed in, the phone's saved picks kept), unlike launch.yaml.
# iOS: a plain relaunch reconnects to the remembered Metro. Android: the dev-client link (as launch.yaml, without
# clearState) loads the bundle from Metro again.
appId: com.nomadkaraoke.mobile
---
- runFlow: close-browser-if-open.yaml
- stopApp
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp
- runFlow:
    when:
      platform: Android
    commands:
      - openLink: "exp+nomad-karaoke://expo-development-client/?url=http%3A%2F%2F10.0.2.2%3A${typeof METRO_PORT !== 'undefined' && METRO_PORT ? METRO_PORT : '8081'}"
- extendedWaitUntil:
    visible: "Runtime version.*|Search songs or artists"
    timeout: "${typeof LAUNCH_TIMEOUT !== 'undefined' && LAUNCH_TIMEOUT ? LAUNCH_TIMEOUT : 60000}"
- runFlow:  # the menu's first-run onboarding (see launch.yaml)
    when:
      visible: "This is the developer menu.*"
    commands:
      - tapOn: "Continue"
- runFlow:
    when:
      visible: "Runtime version.*"
    commands:
      - runFlow: close-dev-menu.yaml
- extendedWaitUntil:
    visible:
      id: "discover-search-input"
    timeout: "${typeof LAUNCH_TIMEOUT !== 'undefined' && LAUNCH_TIMEOUT ? LAUNCH_TIMEOUT : 60000}"
