# In the system photo picker (multiple selection, opened by Screenshot import): pick one photo pushed today by
# maestro/scripts/push-fixtures.sh and confirm. decide's fake extractor ignores the pixels.
appId: com.nomadkaraoke.mobile
---
- runFlow:
    when:
      platform: iOS
    commands:
      # PHPicker labels photos "Photo, <date>, <time>"; this year's have no year in the date: ours.
      - extendedWaitUntil:
          visible: "Photo, [A-Z][a-z]+ [0-9]{2}, [0-9]{2}:[0-9]{2}"
          timeout: 20000
      - tapOn:
          text: "Photo, [A-Z][a-z]+ [0-9]{2}, [0-9]{2}:[0-9]{2}"
          index: 0
      - tapOn: "Done"
