# The join's "What should the host call you?" sheet → SINGER_NAME → the night screen. Env: SINGER_NAME.
appId: com.nomadkaraoke.mobile
---
- extendedWaitUntil:
    visible:
      id: "tonight-name-input"
    timeout: 30000
# No tap: the field has focus with the cursor after the name (a tap would put the cursor mid-name on Android, and
# eraseText deletes only what is before it, leaving the rest: names like "Tess64943").
# (Erased in a few passes, generously.)
- eraseText: 30
- eraseText: 30
- eraseText: 30
- inputText: ${SINGER_NAME}
- tapOn:
    id: "tonight-name-confirm"
# Tonight asks about push once per install after a join. Android: every flow starts from clearState, so the question
# always comes, and its dialog hides the screen from Maestro (tonight-your-songs never "appears" behind it): answer
# it first, allowing for a slow emulator.
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: ${NOT_NOW || 'Not now'}
          timeout: 20000
          optional: true
      - tapOn:
          text: ${NOT_NOW || 'Not now'}
          optional: true
- extendedWaitUntil:
    visible:
      id: "tonight-your-songs"
    timeout: 30000
- runFlow: dismiss-push-ask.yaml
