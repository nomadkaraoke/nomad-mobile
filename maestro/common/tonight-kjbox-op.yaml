# One kjbox test-API call (stack.js ACTION kjbox) then Refresh on the night screen. Env: OP, BODY, ENTRY_ID.
appId: com.nomadkaraoke.mobile
---
- runScript:
    file: ../scripts/stack.js
    env:
      ACTION: kjbox
      KJBOX_STACK: ${KJBOX_STACK}
      OP: ${OP}
      BODY: ${BODY}
      ENTRY_ID: ${ENTRY_ID}
- scrollUntilVisible:
    element:
      id: "tonight-refresh"
    direction: UP
    centerElement: true
- tapOn:
    id: "tonight-refresh"
