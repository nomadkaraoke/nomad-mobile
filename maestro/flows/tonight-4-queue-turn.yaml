# Tonight 4 (spec §8.3, §4.4): the host moves the rotation on (test API) → the status tile counts down, turns green
# ("Nearly your turn") at 3 or fewer from the mic, then the one-time banner says "You're next" and "You're up".
appId: com.nomadkaraoke.mobile
name: tonight-4-queue-turn
tags:
  - tonight
---
- runFlow:
    file: ../common/tonight-reset.yaml
    env:
      NAME: tonight4
- runFlow:
    file: ../common/tonight-join-code.yaml
    env:
      EMAIL: ${output.email}
      SINGER_NAME: "Quinn"
- runFlow:
    file: ../common/tonight-request.yaml
    env:
      QUERY: "hello"
      TITLE: "Hello"
- assertNotVisible:
    id: "tonight-status-urgent"
- takeScreenshot: ${TONIGHT_SHOTS}/tonight-4-waiting
# Move the rotation on until the tile turns green (Refresh instead of waiting for the 15 s poll).
- repeat:
    times: 12
    while:
      notVisible:
        id: "tonight-status-urgent"
    commands:
      - runScript:
          file: ../scripts/stack.js
          env:
            ACTION: kjbox
            KJBOX_STACK: ${KJBOX_STACK}
            OP: advance
      - runFlow: ../common/tonight-refresh.yaml
      - waitForAnimationToEnd:
          timeout: 3000
- assertVisible:
    id: "tonight-status-urgent"
- takeScreenshot: ${TONIGHT_SHOTS}/tonight-4-urgent
# The banner shows for 10 s, so each step waits for it right after the refresh (on a slow emulator, checking the
# status line first used most of that window).
- repeat:
    times: 6
    while:
      notVisible:
        id: "tonight-turn-banner"
    commands:
      - runScript:
          file: ../scripts/stack.js
          env:
            ACTION: kjbox
            KJBOX_STACK: ${KJBOX_STACK}
            OP: advance
      - runFlow: ../common/tonight-refresh.yaml
      - extendedWaitUntil:
          visible:
            id: "tonight-turn-banner"
          timeout: 4000
          optional: true
- assertVisible:
    id: "tonight-turn-banner"
- takeScreenshot: ${TONIGHT_SHOTS}/tonight-4-next-banner
- assertVisible:
    id: "tonight-status-next|tonight-status-afterThis"
- tapOn:
    id: "tonight-turn-banner-dismiss"
- runScript:
    file: ../scripts/stack.js
    env:
      ACTION: kjbox
      KJBOX_STACK: ${KJBOX_STACK}
      OP: advance
- runFlow: ../common/tonight-refresh.yaml
- extendedWaitUntil:
    visible:
      id: "tonight-turn-banner"
    timeout: 8000
- takeScreenshot: ${TONIGHT_SHOTS}/tonight-4-on-stage
- assertVisible:
    id: "tonight-status-onStage"
