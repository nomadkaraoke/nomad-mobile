# 5. Needs review (spec §8.5): auto_approve off → "Needs you" → Review lyrics opens the web review.
appId: com.nomadkaraoke.mobile
name: make-5-needs-review
---
- runScript:
    file: ../scripts/stack.js
    env:
      ACTION: setup
      STACK: ${STACK}
      NAME: review
      CREDITS: "2"
      USER_CONFIG: '{"auto_approve":false}'
- runFlow: ../common/launch.yaml
- runFlow:
    file: ../common/make-any.yaml
    env:
      ARTIST: "Fake Artist"
      TITLE: "Review Song"
- runFlow:
    file: ../common/google-signin.yaml
    env:
      EMAIL: ${output.email}
- extendedWaitUntil:
    visible:
      id: "make-pick"
    timeout: 30000
- tapOn:
    id: "make-submit"
- extendedWaitUntil:
    visible:
      id: "job-review-.*"
    timeout: 90000
- assertVisible:
    id: "job-needs-you-.*"
- takeScreenshot: docs/screenshots/phase1/${PLATFORM}/make-tab-needs-review
- tapOn:
    id: "job-review-.*"
# The in-app browser opens gen web (the local stack's Next app) on the handoff link.
- extendedWaitUntil:
    visible: ".*127\\.0\\.0\\.1.*"
    timeout: 30000
- takeScreenshot: docs/screenshots/phase1/${PLATFORM}/review-bridge-browser
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Done"
- runFlow:
    when:
      platform: Android
    commands:
      - back
- extendedWaitUntil:
    visible:
      id: "job-review-.*"
    timeout: 20000
