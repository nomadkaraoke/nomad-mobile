# Screenshot tour of Discover (Phase 3a UX review): signed-out card, picks with badges, the library info line, every
# filter sheet, the song menu, the quiz's four steps (with the keyboard up on step 4) and the music profile, in the
# app language LOCALE. Not part of the E2E suite: run it through scripts/e2e-local.sh, which sets the app language
# first (and back afterwards) and passes TOUR_SHOTS = docs/screenshots/phase3a/<platform>/<locale>:
#
#   scripts/e2e-local.sh --platform ios --locale ar --screen discover-tour
#
# Targets testIDs only, so it works in any language.
appId: com.nomadkaraoke.mobile
name: screens-discover-tour
onFlowComplete:
  - runFlow: ../common/discover-reset-filters.yaml
---
- runScript:
    file: ../scripts/stack.js
    env:
      ACTION: setup
      STACK: ${STACK}
      NAME: discovertour
- runScript:
    file: ../scripts/stack.js
    env:
      ACTION: decide-seed
      DECIDE_STACK: ${DECIDE_STACK}
      PROFILE: '{"genres":["rock","pop"],"decades":["2000s"],"energy":"high","artists":[{"name":"Muse","affinity":"love"}],"loved":["muse|starlight"]}'
# No browser check here: the app was just relaunched by e2e-local.sh (locale), so Maestro's view hierarchy 500s.
- stopApp
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          clearKeychain: true
- runFlow:
    when:
      platform: Android
    commands:
      - openLink: "exp+nomad-karaoke://expo-development-client/?url=http%3A%2F%2F10.0.2.2%3A8081"
- extendedWaitUntil:
    visible: "Runtime version.*"
    timeout: 20000
    optional: true
- runFlow:
    when:
      visible: "Runtime version.*"
    commands:
      - tapOn: "Close|Continue"
- extendedWaitUntil:
    visible:
      id: "discover-signin-card"
    timeout: 60000
- takeScreenshot: ${TOUR_SHOTS}/tour-01-signed-out
- tapOn:
    id: "discover-signin"
- runFlow:
    file: ../common/google-signin.yaml
    env:
      EMAIL: ${output.email}
- extendedWaitUntil:
    visible:
      id: "rec-row-.*-0"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${TOUR_SHOTS}/tour-02-picks
- tapOn:
    id: "library-filter-karafun"
- extendedWaitUntil:
    visible:
      id: "library-filter-info"
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${TOUR_SHOTS}/tour-03-karafun
- tapOn:
    id: "library-filter-any"
# Every filter sheet (closed with its X).
- tapOn:
    id: "filter-chip-sort"
- extendedWaitUntil:
    visible:
      id: "filter-sheet-sort-panel"
    timeout: 5000
- takeScreenshot: ${TOUR_SHOTS}/tour-04-sheet-sort
- tapOn:
    id: "filter-sheet-sort-close"
- tapOn:
    id: "filter-chip-genre"
- extendedWaitUntil:
    visible:
      id: "filter-sheet-genre-panel"
    timeout: 5000
- takeScreenshot: ${TOUR_SHOTS}/tour-05-sheet-genre
- tapOn:
    id: "filter-sheet-genre-close"
- tapOn:
    id: "filter-chip-decade"
- extendedWaitUntil:
    visible:
      id: "filter-sheet-decade-panel"
    timeout: 5000
- takeScreenshot: ${TOUR_SHOTS}/tour-06-sheet-decade
- tapOn:
    id: "filter-sheet-decade-close"
- tapOn:
    id: "filter-chip-mood"
- extendedWaitUntil:
    visible:
      id: "filter-sheet-mood-panel"
    timeout: 5000
- takeScreenshot: ${TOUR_SHOTS}/tour-07-sheet-mood
- tapOn:
    id: "filter-sheet-mood-close"
# Energy and More sit past the edge: scroll the chip row (towards the start edge under RTL).
- runFlow:
    when:
      true: ${LOCALE != 'ar' && LOCALE != 'he'}
    commands:
      - swipe:
          from:
            id: "filter-bar"
          direction: LEFT
- runFlow:
    when:
      true: ${LOCALE == 'ar' || LOCALE == 'he'}
    commands:
      - swipe:
          from:
            id: "filter-bar"
          direction: RIGHT
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "filter-chip-energy"
- extendedWaitUntil:
    visible:
      id: "filter-sheet-energy-panel"
    timeout: 5000
- takeScreenshot: ${TOUR_SHOTS}/tour-08-sheet-energy
- tapOn:
    id: "filter-sheet-energy-close"
- tapOn:
    id: "filter-chip-more"
- extendedWaitUntil:
    visible:
      id: "filter-sheet-more-panel"
    timeout: 5000
- takeScreenshot: ${TOUR_SHOTS}/tour-09-sheet-more
- tapOn:
    id: "filter-sheet-more-close"
# The song menu.
- tapOn:
    id: "rec-menu-.*-0"
    index: 0
- extendedWaitUntil:
    visible:
      id: "song-menu-hide"
    timeout: 5000
- takeScreenshot: ${TOUR_SHOTS}/tour-10-song-menu
- tapOn:
    id: "song-menu-close"
# The music profile, then the quiz from it (seeded with the profile).
- tapOn:
    id: "tab-me"
- tapOn:
    id: "me-music-profile"
- extendedWaitUntil:
    visible:
      id: "profile-genres"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${TOUR_SHOTS}/tour-11-profile
- tapOn:
    id: "profile-edit-genres"
- extendedWaitUntil:
    visible:
      id: "quiz-genre-rock"
    timeout: 20000
- takeScreenshot: ${TOUR_SHOTS}/tour-12-quiz-genres
- tapOn:
    id: "quiz-next"
- takeScreenshot: ${TOUR_SHOTS}/tour-13-quiz-decades
- tapOn:
    id: "quiz-next|quiz-skip"
- extendedWaitUntil:
    visible:
      id: "quiz-artist-search"
    timeout: 10000
- extendedWaitUntil:
    notVisible:
      id: "quiz-suggestions-loading"
    timeout: 20000
- takeScreenshot: ${TOUR_SHOTS}/tour-14-quiz-artists
- tapOn:
    id: "quiz-next|quiz-skip"
- tapOn:
    id: "quiz-song-search"
- inputText: "hello"
- extendedWaitUntil:
    visible:
      id: "quiz-song-0"
    timeout: 20000
- takeScreenshot: ${TOUR_SHOTS}/tour-15-quiz-songs-keyboard
