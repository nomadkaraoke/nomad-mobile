# 5. Needs review (spec §8.5): auto_approve off → "Needs you" → Review lyrics opens the web review.
appId: com.nomadkaraoke.mobile
name: make-5-needs-review
---
- runScript:
    file: ../scripts/stack.js
    env:
      ACTION: setup
      STACK: ${STACK}
      NAME: review
      CREDITS: "2"
      USER_CONFIG: '{"auto_approve":false}'
- runFlow: ../common/launch.yaml
- runFlow:
    file: ../common/make-any.yaml
    env:
      ARTIST: "Fake Artist"
      TITLE: "Review Song"
- runFlow:
    file: ../common/google-signin.yaml
    env:
      EMAIL: ${output.email}
- extendedWaitUntil:
    visible:
      id: "make-pick"
    timeout: 30000
- tapOn:
    id: "make-submit"
- extendedWaitUntil:
    visible:
      id: "job-review-.*"
    timeout: 90000
- assertVisible:
    id: "job-needs-you-.*"
- takeScreenshot: docs/screenshots/phase1/${PLATFORM}/make-tab-needs-review
- tapOn:
    id: "job-review-.*"
# The in-app browser opens gen web (the local stack's Next app) on the single-use handoff link
# (/auth/verify?…&handoff=1), which signs in without a tap and then goes on to the review.
- extendedWaitUntil:
    visible: ".*127\\.0\\.0\\.1.*"
    timeout: 30000
# Signed in by the handoff: gen web shows "Successfully signed in!" for a moment, then the review page
# (first Next dev compile can be slow). A fast redirect can skip past the interstitial, so either counts;
# the review page is only reachable signed in. (On the local stack the review page itself can show
# "Failed to load lyrics": Next dev mounts it twice and gen's correction-data races awaiting_review ->
# in_review, see task-9 report.)
- extendedWaitUntil:
    visible: "Successfully signed in!?|Failed to load lyrics|Loading\\.\\.\\."
    timeout: 90000
# Let the page settle (interstitial → review page) before the screenshot.
- extendedWaitUntil:
    notVisible: "Successfully signed in!?|Loading\\.\\.\\."
    timeout: 60000
    optional: true
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: docs/screenshots/phase1/${PLATFORM}/review-bridge-browser
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Done"
- runFlow:
    when:
      platform: Android
    commands:
      - back
- extendedWaitUntil:
    visible:
      id: "job-review-.*"
    timeout: 20000
