# 1. Happy path (spec §8.1): 0 credits → decide search (search local stack) → song card → song page → Make it →
#    email code sign-in → credits → Buy (the fake store, Phase 6 IAP) → back to Make it → job → ready → YouTube block →
#    Copy link. The web checkout's Pay path is covered by make-3 (iOS web link) and purchase-2.
appId: com.nomadkaraoke.mobile
name: make-1-happy-path
# Never leave the in-app browser open when the flow ends (SafariViewService crashes on iOS).
onFlowComplete:
  - runFlow: ../common/close-browser-if-open.yaml
---
- runScript:
    file: ../scripts/stack.js
    env:
      ACTION: setup
      STACK: ${STACK}
      NAME: happy
      CREDITS: "0"
- runFlow: ../common/launch.yaml
- extendedWaitUntil:
    visible:
      id: "song-row-0"
    timeout: 30000
- takeScreenshot: ${SHOTS}/discover-popular
# decide's search local stack (fixture index): "hello" is Adele's "Hello", with karaoke versions.
- tapOn:
    id: "discover-search-input"
- inputText: "hello"
- extendedWaitUntil:
    visible:
      id: "song-card"
    timeout: 30000
- assertVisible:
    id: "song-card"
    text: ".*Adele.*"
# Search key: closes the keyboard (and iOS's text edit menu, which can sit over the card).
- pressKey: Enter
- takeScreenshot: ${SHOTS}/discover-search-results
- tapOn:
    id: "song-card"
- extendedWaitUntil:
    visible:
      id: "song-badge"
    timeout: 20000
- takeScreenshot: ${SHOTS}/song-page
- tapOn:
    id: "song-make"
# Sign-in sheet → email → code from the stack's captured outbox.
- extendedWaitUntil:
    visible:
      id: "signin-sheet"
    timeout: 10000
- takeScreenshot: ${SHOTS}/signin-sheet
- tapOn:
    id: "signin-email-start"
- extendedWaitUntil:
    visible:
      id: "signin-email"
    timeout: 10000
- tapOn:
    id: "signin-email"
- inputText: ${output.email}
- takeScreenshot: ${SHOTS}/signin-email
- tapOn:
    id: "signin-send"
- extendedWaitUntil:
    visible:
      id: "signin-code-screen"
    timeout: 15000
- runScript:
    file: ../scripts/stack.js
    env:
      ACTION: code
      STACK: ${STACK}
      EMAIL: ${output.email}
- takeScreenshot: ${SHOTS}/signin-code
- inputText: ${output.code}
# 0 credits: the make flow sends the person to credits.
# The store's packs (FAKE_IAP); 3 credits is preselected.
- extendedWaitUntil:
    visible:
      id: "credits-buy"
      enabled: true
    timeout: 30000
- takeScreenshot: ${SHOTS}/credits-picker
- tapOn:
    id: "credits-buy"
# "Credits added" shows for under a second before the screen returns to the make flow (Android's slower
# hierarchy reads can miss it), so the proof of payment is the new balance there.
- runFlow:
    when:
      visible:
        id: "credits-added"
    commands:
      - takeScreenshot: ${SHOTS}/credits-added
# Back in the make flow, gen's pick is ready to confirm, with the 3 credits just bought.
- extendedWaitUntil:
    visible:
      id: "make-pick"
    timeout: 30000
- assertVisible: ".*You have 3.*"
- takeScreenshot: ${SHOTS}/make-pick-perfect
- runFlow: ../common/make-submit.yaml
- extendedWaitUntil:
    visible:
      id: "make-list"
    timeout: 20000
- assertVisible:
    id: "job-card-.*"
- takeScreenshot: ${SHOTS}/make-tab-working
- extendedWaitUntil:
    visible:
      id: "job-ready-.*"
    timeout: 120000
- takeScreenshot: ${SHOTS}/make-tab-ready
- tapOn:
    id: "job-card-.*"
- extendedWaitUntil:
    visible:
      id: "ready-youtube-link"
    timeout: 20000
- tapOn:
    id: "ready-copy"
- assertVisible:
    id: "ready-copied"
- takeScreenshot: ${SHOTS}/ready-youtube-copied
