# Find tab → live decide search → song detail.
# 43362 = decide catalog id for Lionel Richie "Hello" (verified 2026-10-14); if it changes, tap by text instead.
appId: com.nomadkaraoke.mobile
---
- runFlow: ../common/launch.yaml
- tapOn:
    id: "find-search-input"
- inputText: "hello"
- extendedWaitUntil:
    visible:
      id: "song-row-43362"
    timeout: 20000
- tapOn:
    id: "song-row-43362"
- assertVisible:
    id: "song-make"
# iOS has no hardware back: the pushed song screen must offer a visible back button.
- tapOn: "Back"
- assertVisible:
    id: "find-search-input"
