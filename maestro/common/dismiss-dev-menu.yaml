# After a dev-client load: wait for the app's tab bar, closing the dev menu (native, English) if it opened over
# the app (Android opens it on every fresh load; it hides the app's elements from Maestro). Testids only for
# the app, so it works in any app language.
appId: com.nomadkaraoke.mobile
---
- extendedWaitUntil:
    visible: "Runtime version.*"
    timeout: 20000
    optional: true
- runFlow:  # the menu's first-run onboarding (see launch.yaml)
    when:
      visible: "This is the developer menu.*"
    commands:
      - tapOn: "Continue"
- runFlow:
    when:
      visible: "Runtime version.*"
    commands:
      - runFlow: close-dev-menu.yaml
# Android: the Close tap can land after the dev menu has gone, on the launcher behind it (it opened YouTube);
# bring the app back if it isn't showing (see launch.yaml).
- runFlow:
    when:
      platform: Android
      notVisible:
        id: "tab-make"
    commands:
      - launchApp:
          stopApp: false
- extendedWaitUntil:
    visible:
      id: "tab-make"
    timeout: 60000
