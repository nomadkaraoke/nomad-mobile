# Signed in on Discover with a seeded profile (so there are picks), then Improve → "Connect your music".
# Resets decide's fakes first (seeded fake users, knobs). Env: EMAIL.
appId: com.nomadkaraoke.mobile
---
- runScript:
    file: ../scripts/stack.js
    env:
      ACTION: fake-externals
      DECIDE_STACK: ${DECIDE_STACK}
- runFlow:
    file: discover-seeded.yaml
    env:
      EMAIL: ${EMAIL}
      PROFILE: '{"genres":["pop","rock"]}'
# The Improve card is last on the picks. scrollUntilVisible missed its row now and then on iOS (on screen, the 100%
# visibility check failing), and a row that only just showed sits under the tab bar, where the tap lands on a tab:
# scroll until it shows, then once more (as common/voice-session-scroll-to-entry.yaml does).
- repeat:
    times: 8
    while:
      notVisible:
        id: "discover-improve-connect"
    commands:
      - scroll
- scroll
- extendedWaitUntil:
    visible:
      id: "discover-improve-connect"
    timeout: 20000
- tapOn:
    id: "discover-improve-connect"
- extendedWaitUntil:
    visible:
      id: "connect-hub"
    timeout: 20000
