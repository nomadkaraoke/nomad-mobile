# Word sheet: replace a word's text. Env: LINE, WORD (indices), TEXT. Taps the line first (selects it), then the
# word (on a selected line a word tap opens its sheet).
appId: com.nomadkaraoke.mobile
---
- runFlow:
    file: select-line.yaml
    env:
      LINE: ${LINE}
- tapOn:
    id: "review-word-${LINE}-${WORD}"
- extendedWaitUntil:
    visible:
      id: "review-word-input"
    timeout: 10000
- tapOn:
    id: "review-word-input"
# Type only once the field has focus: on an Android dev build, keys that reach no field go to the dev
# support's key listener, where a double "r" reloads the JS bundle.
- extendedWaitUntil:
    visible:
      id: "review-word-input"
      focused: true
    timeout: 5000
- eraseText: 30
- inputText: ${TEXT}
- tapOn:
    id: "review-word-save"
- extendedWaitUntil:
    notVisible:
      id: "review-word-sheet"
    timeout: 10000
