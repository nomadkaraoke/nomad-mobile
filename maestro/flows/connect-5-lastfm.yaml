# Connect 5 (Phase 3b spec §5.5): a fake Last.fm user → Connect → Last.fm → the username → the sync (decide runs it
# inline on the local stack) → what it added → Me's "Connected" list shows Last.fm with songs.
appId: com.nomadkaraoke.mobile
name: connect-5-lastfm
tags:
  - connect
---
- runScript:
    file: ../scripts/stack.js
    env:
      ACTION: setup
      STACK: ${STACK}
      NAME: connect5
- runFlow:
    file: ../common/connect-open.yaml
    env:
      EMAIL: ${output.email}
- runScript:
    file: ../scripts/stack.js
    env:
      ACTION: fake-lastfm-user
      DECIDE_STACK: ${DECIDE_STACK}
- tapOn:
    id: "connect-card-lastfm"
- tapOn:
    id: "connect-lastfm-username"
- inputText: ${output.lastfmUsername}
- tapOn:
    id: "connect-lastfm-submit"
- extendedWaitUntil:
    visible:
      id: "connect-import-result"
    timeout: 60000
- takeScreenshot: ${SHOTS3B}/connect-5-result
- runScript:
    file: ../scripts/stack.js
    env:
      ACTION: source-counts
      DECIDE_STACK: ${DECIDE_STACK}
      SOURCE: lastfm
      MIN_SONGS: "1"
- runFlow:
    file: ../common/connect-profile-row.yaml
    env:
      SOURCE: lastfm
- takeScreenshot: ${SHOTS3B}/connect-5-profile
