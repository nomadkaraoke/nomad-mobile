# The host moves the rotation on (test API) until the singer is on stage ("You're up"), refreshing instead of
# waiting for the 15 s poll.
appId: com.nomadkaraoke.mobile
---
- repeat:
    times: 15
    while:
      notVisible:
        id: "tonight-status-summary"
        text: ".*You're up.*"
    commands:
      - runScript:
          file: ../scripts/stack.js
          env:
            ACTION: kjbox
            KJBOX_STACK: ${KJBOX_STACK}
            OP: advance
      - scrollUntilVisible:
          element:
            id: "tonight-refresh"
          direction: UP
      - tapOn:
          id: "tonight-refresh"
      - waitForAnimationToEnd:
          timeout: 3000
- assertVisible:
    id: "tonight-status-summary"
    text: ".*You're up.*"
